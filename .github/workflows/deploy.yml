name: Drupal LastNewsInUA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Mirohost
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MIROHOST_HOST }}
          username: ${{ secrets.MIROHOST_USER }}
          password: ${{ secrets.MIROHOST_PASSWORD }}
          port: 22
          source: "./"
          target: "/var/www/lastnews"
