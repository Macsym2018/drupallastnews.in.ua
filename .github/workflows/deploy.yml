name: Drupal LastNewsInUA

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Deploy to Mirohost
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MIROHOST_HOST }}
          username: ${{ secrets.MIROHOST_USER }}
          password: ${{ secrets.MIROHOST_PASSWORD }}
          source: "./"
          target: "/var/www/lastnews"
