name: SSH Deploy to Mirohost

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run composer install on server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.MIROHOST_HOST }}
          username: ${{ secrets.MIROHOST_USER }}
          password: ${{ secrets.MIROHOST_PASSWORD }}
          script: |
            ls -l
            cd lastnews.in.ua
            composer install --no-dev

